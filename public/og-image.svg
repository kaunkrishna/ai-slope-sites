<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Font Finder</title><desc id="desc">Find fonts from images and free alternatives.</desc>
  <rect width="1200" height="630" fill="#fafafa"/>
  <g opacity=".45" filter="url(#blur)"><circle cx="700" cy="130" r="200" fill="#50e3c2"/><circle cx="880" cy="220" r="220" fill="#007cf0"/><circle cx="800" cy="410" r="220" fill="#ff0080"/><circle cx="580" cy="420" r="180" fill="#7928ca"/></g>
  <rect x="82" y="75" width="48" height="48" fill="#171717"/><text x="98" y="110" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">F</text>
  <text x="148" y="110" fill="#171717" font-family="Arial,sans-serif" font-size="28" font-weight="700">Font Finder</text>
  <text x="82" y="280" fill="#171717" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Find the font.</text>
  <text x="82" y="365" fill="#4d4d4d" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Keep the feeling.</text>
  <text x="82" y="455" fill="#4d4d4d" font-family="Arial,sans-serif" font-size="28">Find font matches and free alternatives from any image.</text>
  <defs><filter id="blur"><feGaussianBlur stdDeviation="70"/></filter></defs>
</svg>
